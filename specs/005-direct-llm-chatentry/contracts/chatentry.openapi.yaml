# OpenAPI fragment for POST /v1/chatentry/
#
# This file is the contract pinned by the contract test
# tests/contract/test_chatentry_contract.py. It is merged into the
# application-wide OpenAPI document at runtime by FastAPI; the fragment
# here is the source of truth that contract tests assert against.
#
# Conventions:
# - All times are ISO-8601 with timezone offset.
# - The X-Session-ID and X-Correlation-ID headers follow the same
#   semantics as /v1/entries (features 001 + 003).

openapi: 3.0.3
info:
  title: MomDiary — Direct-LLM Chat Entry
  version: "0.1.0"

paths:
  /v1/chatentry/:
    post:
      summary: One-shot LLM dispatch that creates / updates / deletes a single entry.
      description: |
        Accepts a caregiver message (plus optional chat history and an
        optional session id) and returns a structured outcome describing
        the create / update / delete that was performed, a clarification
        question, or a typed error. No `Agent` / `ChatAgent` runtime is
        used (FR-003); the handler calls Azure OpenAI directly via the
        Microsoft Agent Framework chat-client primitive and dispatches
        to the same tool registry used by `/v1/entries`.
      operationId: chatEntryDispatch
      parameters:
        - in: header
          name: X-Session-ID
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Optional session id. When supplied and resolvable, the
            in-memory session store from feature 003 supplies chat
            history; the request body's `history` is ignored. When
            absent, the response carries a fresh server-issued
            session id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatEntryRequest"
      responses:
        "200":
          description: |
            Successful dispatch — outcome is one of `created`, `updated`,
            `deleted`, `clarification_requested`, or `error`. The HTTP
            status is 200 for all five outcomes (mirrors `/v1/entries`);
            the typed `outcome` field carries the semantic result.
          headers:
            X-Session-ID:
              schema:
                type: string
                format: uuid
              description: Echoed / freshly issued session id.
            X-Correlation-ID:
              schema:
                type: string
              description: Echoed correlation id (middleware-assigned if absent on input).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatEntryResponse"
        "400":
          description: |
            Request validation error — empty message, message too large
            (`message` exceeds `momdiary_session_message_max_bytes`), or
            malformed body. The endpoint never writes to the database
            on this path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ChatEntryRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8192
          description: The caregiver's current message.
        history:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ChatHistoryTurn"
          description: |
            Optional client-supplied history. Ignored when an
            `X-Session-ID` header resolves to a non-empty server-side
            session.
        correlation_id:
          type: string
          description: Optional explicit correlation id; echoed in logs and response.

    ChatHistoryTurn:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        role:
          type: string
          enum: [caregiver, assistant]
        text:
          type: string
          minLength: 1
          maxLength: 8192
        outcome:
          type: string
          enum: [created, updated, deleted, clarification_requested, error]
          nullable: true
        entry_type:
          type: string
          enum: [feed, sleep, poop, appointment]
          nullable: true
        entry_id:
          type: integer
          nullable: true

    ChatEntryResponse:
      type: object
      additionalProperties: false
      required: [outcome, agent_message, correlation_id, session_id]
      properties:
        outcome:
          type: string
          enum: [created, updated, deleted, clarification_requested, error]
        agent_message:
          type: string
          description: |
            Human-readable assistant text. For
            `clarification_requested`, the LLM's question. For `error`,
            an operator-grade summary; clients SHOULD render
            `error_reason` instead for end users when present.
        entry_type:
          type: string
          enum: [feed, sleep, poop, appointment]
          nullable: true
          description: |
            Required when `outcome` is `created`, `updated`, or
            `deleted`; omitted otherwise.
        entry_id:
          type: integer
          nullable: true
          description: |
            Required when `outcome` is `created`, `updated`, or
            `deleted`; omitted otherwise.
        selected_tool:
          type: string
          nullable: true
          description: Name of the tool dispatched, when applicable.
        error_reason:
          type: string
          nullable: true
          enum:
            - malformed_llm_output
            - unknown_tool
            - invalid_tool_arguments
            - tool_execution_failed
            - llm_unavailable
            - validation_error
          description: Required when `outcome == "error"`.
        suggested_candidates:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SuggestedCandidate"
        correlation_id:
          type: string
        session_id:
          type: string
          format: uuid

    SuggestedCandidate:
      type: object
      additionalProperties: false
      required: [entry_type, entry_id, summary]
      properties:
        entry_type:
          type: string
          enum: [feed, sleep, poop, appointment]
        entry_id:
          type: integer
        summary:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message, correlation_id]
      properties:
        error:
          type: string
          enum: [validation_error]
        message:
          type: string
        details:
          type: object
          nullable: true
        correlation_id:
          type: string
        session_id:
          type: string
          format: uuid
          nullable: true
